name: aws-todo frontend
on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest
    
        steps: 
            - name: code checkout
            uses: actions/checkout@v4

            - name: loginto docker hub
            uses: docker/login-action@v3
            with: 
                username: ${{secrets.usrname}}
                password: ${{secrets.pass}}
            
            - name: build docker image
            run: |
                docker build -t ${{secrets.usrname}}/to-do:latest .
            
            - name: push image to docker hub
            run: |
                docker push ${{secrets.usrname}}/to-do:latest
    
           

          
    


